<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Saiba mais sobre o projeto hungreless.">
    <title>Sobre - AgroTutoriais</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/estilo.css">
</head>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<body>

    <header>
        <img src="img/logoai.jpg" alt="Logo Hungreless" class="logo">
        <nav>
            <ul>
                <li><a href="index.html" class="ativo">Início</a></li>
                <li><a href="tutoriais.html">Tutoriais</a></li>
                <li><a href="dicas.html">Dicas</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="fale conosco.html">fale conosco</a></li>
                <li><a href="simulador.html">simulador</a></li>
                <li><a href="perfil.html">Perfil</a></li>

            </ul>
        </nav>
    </header>

    <main class="container my-5">
            <div id="react-sobre"></div>
    </main>
<script type="text/babel">


// 👤 USUÁRIO
function Usuario() {
  const [nome, setNome] = React.useState("");

  React.useEffect(() => {
    const user = JSON.parse(localStorage.getItem("usuario"));
    if (user) setNome(user.nome);
  }, []);

  if (!nome) return null;

  return <div className="user-badge">👤 {nome}</div>;
}

// 🔐 PROTEÇÃO
function Protecao({ children }) {
  const [ok, setOk] = React.useState(false);

  React.useEffect(() => {
    const user = JSON.parse(localStorage.getItem("usuario"));
    if (!user) {
      window.location.href = "perfil.html";
    } else {
      setOk(true);
    }
  }, []);

  if (!ok) return null;

  return children;
}

// ⬆️ BOTÃO TOPO
function BotaoTopo() {
  const [show, setShow] = React.useState(false);

  React.useEffect(() => {
    const handleScroll = () => setShow(window.scrollY > 100);
    window.addEventListener("scroll", handleScroll);
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  if (!show) return null;

  return (
    <div id="topo" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
      ↑
    </div>
  );
}

// 📄 SOBRE
function Sobre() {
  const [expandido, setExpandido] = React.useState(false);
  const [visitas, setVisitas] = React.useState(120);

  React.useEffect(() => {
    const intervalo = setInterval(() => {
      setVisitas(v => v + Math.floor(Math.random() * 3));
    }, 3000);

    return () => clearInterval(intervalo);
  }, []);

  return (
    <div className="text-center">

      <h1 className="mb-4">Sobre o Hungreless</h1>

      <p className="lead">
        O AgroTutoriais nasceu com o objetivo de compartilhar conhecimento agrícola.
        {expandido && (
          <>
            {" "}Nosso foco é ajudar produtores com técnicas sustentáveis,
            melhorar a produtividade e preservar o meio ambiente.
          </>
        )}
      </p>

      <button
        className="btn btn-success mb-3"
        onClick={() => setExpandido(!expandido)}
      >
        {expandido ? "Mostrar menos" : "Mostrar mais"}
      </button>

      <p className="text-muted">
        👥 Visitantes: {visitas}
      </p>

      <div className="mt-4">
        <img
          src="img/capa-agricultura-sustentavel copy.jpeg"
          className="img-fluid rounded shadow sobre-img"
        />
      </div>

    </div>
  );
}

// 🧠 APP FINAL
function App() {
  return (
    <Protecao>
      <Usuario />
      <Sobre />
      <BotaoTopo />
    </Protecao>
  );
}

ReactDOM.createRoot(document.getElementById("react-sobre")).render(<App />);
</script>
   <footer>
    <p>Hungreless</p>
</footer>
</body>
</html>
